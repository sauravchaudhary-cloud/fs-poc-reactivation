<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }

      div {
        position: relative;
      }

      .child1 {
        height: 50px;
        width: 50px;
        background-color: black;
        top: 100%;
        left: 0%;
      }

      .child2 {
        height: 50px;
        width: 50px;
        background-color: black;
        top: 0%;
        left: 100%;
      }

      .child3 {
        height: 50px;
        width: 50px;
        background-color: black;
        top: 0%;
        left: 100%;
      }

      .child4 {
        height: 50px;
        width: 50px;
        background-color: black;
        top: 100%;
        left: 100%;
      }

      .child5 {
        height: 50px;
        width: 50px;
        background-color: black;
        top: 50%;
        left: 50%;
        translate: (-50%, -50%);
      }
    </style>
  </head>

  <body>
    <div class="child1">1</div>
    <div class="child2">2</div>
    <div class="child3">3</div>
    <div class="child4">4</div>
    <div class="child5">5</div>
  </body>
</html>
